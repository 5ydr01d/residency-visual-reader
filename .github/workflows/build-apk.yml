name: Build Residency Visual Reader APK

on:
  push:
    paths:
      - "ResidencyVisualReaderAndroid_Project.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f ResidencyVisualReaderAndroid_Project.zip
          mkdir -p project-source
          unzip -q ResidencyVisualReaderAndroid_Project.zip -d project-source

          PROJECT_DIR="project-source/ResidencyVisualReaderAndroid"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix mobile sidebar scrolling for Android WebView
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          asset = Path("project-source/ResidencyVisualReaderAndroid/app/src/main/assets/index.html")
          html = asset.read_text(encoding="utf-8")
          marker = "Android WebView mobile navigation scroll fix"
          if marker in html:
              print("Mobile sidebar scrolling fix is already present.")
              raise SystemExit(0)

          closing_style = "</style>"
          if closing_style not in html:
              raise SystemExit("Could not find the closing style tag in index.html.")

          css = r"""
          /* Android WebView mobile navigation scroll fix */
          @media (max-width:760px), (max-width:950px) and (max-height:600px) and (orientation:landscape) {
            #study-sidebar {
              display:flex !important;
              flex-direction:column !important;
              position:fixed !important;
              top:var(--topbar-height) !important;
              bottom:auto !important;
              height:calc(100vh - var(--topbar-height)) !important;
              max-height:calc(100vh - var(--topbar-height)) !important;
              min-height:0 !important;
              overflow:hidden !important;
            }
            #nav-tree {
              display:block;
              flex:1 1 auto !important;
              min-height:0 !important;
              max-height:100% !important;
              overflow-y:scroll !important;
              overflow-x:hidden !important;
              -webkit-overflow-scrolling:touch;
              overscroll-behavior-y:contain;
              touch-action:pan-y;
              scrollbar-width:thin;
            }
          }
          @supports (height:100dvh) {
            @media (max-width:760px), (max-width:950px) and (max-height:600px) and (orientation:landscape) {
              #study-sidebar {
                height:calc(100dvh - var(--topbar-height)) !important;
                max-height:calc(100dvh - var(--topbar-height)) !important;
              }
            }
          }
          """
          html = html.replace(closing_style, css + "\n" + closing_style, 1)
          asset.write_text(html, encoding="utf-8")
          print("Added dedicated touch-scroll area for the mobile topic tree.")
          PY

      - name: Build debug APK
        run: |
          gradle --no-daemon \
            -p "$ANDROID_PROJECT_DIR" \
            assembleDebug

      - name: Verify APK
        run: |
          test -f "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: residency-visual-reader-debug-apk
          path: project-source/ResidencyVisualReaderAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
