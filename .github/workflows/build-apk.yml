
name: Build Residency Visual Reader APK

on:
  push:
    paths:
      - "ResidencyVisualReaderAndroid_Project.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f ResidencyVisualReaderAndroid_Project.zip
          mkdir -p project-source
          unzip -q ResidencyVisualReaderAndroid_Project.zip -d project-source

          PROJECT_DIR="project-source/ResidencyVisualReaderAndroid"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          gradle --no-daemon \
            -p "$ANDROID_PROJECT_DIR" \
            assembleDebug

      - name: Verify APK
        run: |
          test -f "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: residency-visual-reader-debug-apk
          path: project-source/ResidencyVisualReaderAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

